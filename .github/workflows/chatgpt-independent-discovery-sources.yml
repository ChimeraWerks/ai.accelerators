name: ChatGPT Independent Discovery Sources

on:
  pull_request:
    paths:
      - ".github/workflows/chatgpt-independent-discovery-sources.yml"
      - "tools/chatgpt-share-inventory/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        source:
          - wayback
          - commoncrawl
          - arquivo
          - github-code
          - github-issues
          - github-commits
          - sourcegraph
          - grep-app
          - searxng
          - duckduckgo
          - bing
          - mojeek
          - qwant
          - urlscan
          - otx
          - bluesky
          - reddit
          - arctic-shift
          - hackernews
          - stackexchange
          - lemmy
          - discourse
          - gdelt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/chatgpt-share-inventory/requirements.txt

      - name: Compile isolated-source pipeline
        run: >-
          python -m py_compile
          tools/chatgpt-share-inventory/build_inventory.py
          tools/chatgpt-share-inventory/run_independent_v2.py
          tools/chatgpt-share-inventory/run_independent_group.py
          tools/chatgpt-share-inventory/run_independent_stage.py

      - name: Run independent source adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INVENTORY_OUT: ${{ github.workspace }}/inventory-output
          DISCOVERY_SOURCE: ${{ matrix.source }}
        run: python tools/chatgpt-share-inventory/run_independent_stage.py

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-independent-source-${{ matrix.source }}
          path: inventory-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
