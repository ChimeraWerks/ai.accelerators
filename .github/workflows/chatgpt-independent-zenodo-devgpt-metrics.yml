name: ChatGPT Independent Zenodo DevGPT Metrics

on:
  pull_request:
    paths:
      - ".github/workflows/chatgpt-independent-zenodo-devgpt-metrics.yml"
      - "tools/chatgpt-share-inventory/run_devgpt_zenodo_metrics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/chatgpt-share-inventory/requirements.txt

      - name: Compile Zenodo enrichment
        run: python -m py_compile tools/chatgpt-share-inventory/build_inventory.py tools/chatgpt-share-inventory/run_devgpt_zenodo_metrics.py

      - name: Extract non-content metrics from Zenodo DevGPT
        env:
          INVENTORY_OUT: ${{ github.workspace }}/inventory-output
        run: python tools/chatgpt-share-inventory/run_devgpt_zenodo_metrics.py

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-independent-source-zenodo-devgpt-metrics
          path: inventory-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
