name: Claude Share Inventory Artifact History

on:
  pull_request:
    paths:
      - ".github/workflows/claude-share-inventory.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  list-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export workflow runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p history
          gh api --paginate "repos/$REPO/actions/workflows/322201383/runs?per_page=100" > history/workflow-runs.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          runs = json.loads(Path('history/workflow-runs.json').read_text()).get('workflow_runs', [])
          out = []
          for run in runs:
              rid = run['id']
              raw = subprocess.check_output(['gh','api',f"repos/{os.environ['REPO']}/actions/runs/{rid}/artifacts?per_page=100"], text=True)
              payload = json.loads(raw)
              out.append({'run': run, 'artifacts': payload.get('artifacts', [])})
          Path('history/workflow-history.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          PY

      - name: Upload history
        uses: actions/upload-artifact@v4
        with:
          name: claude-share-inventory-workflow-history
          path: history/
          if-no-files-found: error
          retention-days: 1
