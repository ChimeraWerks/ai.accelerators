name: Claude Share Inventory Multi-Index

on:
  pull_request:
    paths:
      - ".github/workflows/claude-share-inventory.yml"
      - "tools/claude-share-inventory/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/claude-share-inventory/requirements.txt

      - name: Compile collector
        run: python -m py_compile tools/claude-share-inventory/build_inventory.py tools/claude-share-inventory/run_bounded.py tools/claude-share-inventory/run_core.py

      - name: Build bounded multi-index inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INVENTORY_OUT: ${{ github.workspace }}/inventory-output
        run: python tools/claude-share-inventory/run_bounded.py

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-share-inventory-multi-index
          path: inventory-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
